# Deliberately no native provider-backed agent: startup must not require an
# API key. AgentPool creates one ACP session per agent eagerly at pool init,
# so every agent listed here must accept session/new unauthenticated.
# codex-acp rejects session/new with "Authentication required" until an
# OpenAI credential is provided, which crash-loops the whole pool — so Codex
# is excluded here and remains reachable through contextforge-mcacp, where
# adapters spawn lazily per client session and an auth failure is contained.
agents:
  claude:
    type: acp
    provider: custom
    command: /usr/local/bin/node
    args:
      - /opt/acp-adapters/claude-agent-acp/dist/index.js
    display_name: Claude Agent ACP
    description: Claude Agent SDK through the official Agent Client Protocol adapter.
    cwd: /workspace
    allow_file_operations: true
    allow_terminal: true
    auto_approve: false
