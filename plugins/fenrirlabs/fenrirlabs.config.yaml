# Fenrir Labs skill hooks — REFERENCE COPY.
#
# Thin native cpex adapters -> out-of-process fenrirlabs gateway (port 8778).
# Skill assets + manifest now live in the standalone FenrirLabs service
# (/mnt/jarvis-data/projects/FenrirLabs); this dir holds only the cpex adapter.
#
# All DISABLED until fenrirlabs-gateway is running. Flip mode to "transform" per skill.

plugins:
  - name: "FenrirInboxTriage"
    kind: "plugins.fenrirlabs.skill_hook.FenrirSkillHook"
    description: "Inject google-inbox-triage skill context on matching Gmail tool calls."
    version: "1.0.0"
    author: "Fenrir Labs / EVECOR"
    hooks: ["tool_pre_invoke", "prompt_pre_fetch"]
    tags: ["fenrirlabs", "skill", "gmail", "inbox"]
    mode: "disabled"
    priority: 150
    config:
      skill_id: "inbox-triage"
      fail_mode: "open"
      endpoint:
        base_url: "http://127.0.0.1:8778"
        path: "/v1/hook"
        timeout_ms: 500

