plugins:
  - name: "ComputerUseLinuxBridge"
    kind: "plugins.computer_use_linux_bridge.computer_use_linux_bridge.ComputerUseLinuxBridgePlugin"
    description: "Inject Linux desktop-control guidance and guard computer-use-linux MCP tool calls."
    version: "0.1.0"
    author: "EVECOR"
    hooks: ["agent_pre_invoke", "tool_pre_invoke"]
    tags: ["evecor", "computer-use", "linux", "desktop-control", "bridge"]
    mode: "disabled" # NOT live config — nothing in plugins/config.yaml includes this file
    # (verified 2026-07-15: no !include mechanism exists, this filename appears
    # nowhere except a comment in config.yaml). The real live entry is the
    # "ComputerUseLinuxBridge" block directly inside plugins/config.yaml, which
    # pointed at a nonexistent external/ subprocess — see that file's own
    # comment for the fix applied there instead of here.
    priority: 130
    conditions: []
    config:
      activation:
        always_on: false
        session_tags: ["computer-use-linux"]
        agent_id_prefixes: []
      skill_path: null
      tool_prefixes:
        - "computer_use_linux_"
        - "computer-use-linux."
        - "computer-use-linux/"
        - "computer-use-linux:"
        - "computer-use-linux-"
      server_id_fragments:
        - "computer-use-linux"
        - "computer_use_linux"
      match_unqualified_tools: false
      confirmation_arg: "_computer_use_linux_confirmed"
      trusted_session_tags:
        - "computer-use-linux-approved"
        - "desktop-control-approved"
      guarded_tool_classes:
        - "setup"
        - "destructive"
      enforce_screenshot_defaults: true
      screenshot_defaults:
        max_width: 1920
        max_height: 1920
        max_bytes: 2097152
        format: null
        quality: null
